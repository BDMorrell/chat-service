[workspace]
members = [
    "chatroom",
    "misc",
    "server",
]

resolver = "2"

[workspace.dependencies]
axum = "0.8"
tokio = {version = "1", features = ["full"]}
serde = {version = "1", features = ["derive"]}
tower = {version = "0.5", features = ["full"]}
tower-http = {version = "0.6", features = ["full"]}
http = "1"
